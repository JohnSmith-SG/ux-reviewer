# Проверка типов + сборка Docker-образа при каждом push в main → GitHub Container Registry.
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: mypy --strict
        run: |
          pip install -q -r requirements.txt mypy types-requests
          mypy --strict --ignore-missing-imports agent.py openai_module.py app.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/johnsmith-sg/ux-reviewer:latest
            ghcr.io/johnsmith-sg/ux-reviewer:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=UX-рецензент сайта: ссылка → ИИ-агент → UX-отчёт
