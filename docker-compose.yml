# Запуск: docker compose up -d   (локально с ключом в .env или на сервере с ключом файлом)
# Локальная сборка вместо готового образа: docker compose up -d --build
# С доменом и HTTPS: COMPOSE_PROFILES=https и UX_DOMAIN=ux.example.ru в .env (см. .env.example)
services:
  ux-reviewer:
    image: ghcr.io/johnsmith-sg/ux-reviewer:latest
    build: .
    container_name: ux-reviewer
    restart: unless-stopped
    ports:
      # за Caddy — только 127.0.0.1, чтобы в обход HTTPS и лимитов никто не ходил
      - "${UX_BIND:-0.0.0.0}:${UX_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      UX_DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./secrets:/run/secrets:ro
    user: "${UX_UID:-10001}:${UX_GID:-10001}"
    mem_limit: 200m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  caddy:
    profiles: [https]
    image: caddy:2.11.6-alpine
    container_name: ux-caddy
    restart: unless-stopped
    depends_on: [ux-reviewer]
    ports:
      - "80:80"
      - "${UX_HTTPS_PORT:-8443}:8443"
    environment:
      UX_DOMAIN: ${UX_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/data
    mem_limit: 80m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
